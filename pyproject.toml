[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sshguard"
version = "1.0.0"
description = "SSH brute-force guard: reads sshd logs, recognises repeated failures and bans the source with nftables."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Standard library only. Windows has no time zone database of its own, so it gets tzdata.
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.4",
  "mypy>=1.10",
  "playwright>=1.45",  # only to render the README screenshot
]

[project.scripts]
sshguard = "sshguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
markers = ["nft: needs root and a working nftables (skipped otherwise)"]

[tool.coverage.run]
source = ["sshguard"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"tools/*" = ["E501"]
